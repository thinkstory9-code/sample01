<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e7df">
  <meta name="description" content="마음이 흐린 날 잠시 쉬어 갈 수 있는, 사진과 짧은 문장으로 채운 다섯 장의 작은 책자">
  <title>마음이 흐린 날에</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292a28;
      --muted: #777970;
      --accent: #7a8372;
      --paper: #fbfaf6;
      --stage: #e9e7df;
      --line: #e8e7e0;
      --serif: "Iowan Old Style", "Baskerville", "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--stage);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid #475a3f; outline-offset: 4px; }
    .shell { width: min(1180px, calc(100% - 80px)); margin: 0 auto; }
    .topbar {
      padding: 34px 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.04em; }
    .edition { color: #77766f; font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 22px; }
    .music-player { display: flex; align-items: center; gap: 11px; }
    .music-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 108px; min-height: 36px; padding: 8px 13px; border: 1px solid #bcc4b6; border-radius: 30px; background: #f8f9f4; color: #445345; font-size: 11px; font-weight: 700; cursor: pointer; transition: background .2s; }
    .music-toggle:hover { background: #fff; }
    .music-toggle[aria-pressed="true"] { background: #63765e; border-color: #63765e; color: #fff; }
    .music-toggle svg, .volume-control svg { width: 16px; height: 16px; flex-shrink: 0; }
    .volume-control { display: inline-flex; align-items: center; gap: 7px; color: #6b756a; }
    .volume-control input { width: 72px; height: 20px; cursor: pointer; accent-color: #63765e; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .book-wrap { position: relative; }
    .book-wrap::before {
      content: "";
      position: absolute;
      z-index: 0;
      left: 5%; right: 5%; bottom: -18px;
      height: 24px;
      border-radius: 50%;
      background: #55584b35;
      filter: blur(17px);
    }
    .book {
      position: relative;
      z-index: 1;
      height: clamp(480px, 57vw, 630px);
      background: var(--paper);
      border: 1px solid #e2e0d9;
      box-shadow: 0 2px 3px #3c382413, 0 18px 48px #3c382418;
      overflow: hidden;
      isolation: isolate;
    }
    .book::before, .book::after {
      content: "";
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }
    .book::before {
      left: calc(50% - 23px);
      top: 0;
      bottom: 0;
      width: 46px;
      background: linear-gradient(90deg, transparent 0%, #37352c08 28%, #37352c18 49%, #ffffffa0 56%, transparent 100%);
    }
    .book::after { inset: 0; box-shadow: inset 0 0 16px #3c39270a; }
    #spread-root { height: 100%; }
    .spread {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      height: 100%;
      animation: page-enter .43s cubic-bezier(.2,.7,.3,1) both;
    }
    .spread.image-right .image-leaf { order: 2; }
    .spread.image-right .text-leaf { order: 1; }
    .leaf { min-width: 0; min-height: 0; }
    .image-leaf {
      position: relative;
      background: #d1d3c9;
      padding: 26px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .image-mat {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #c5c9bf;
      overflow: hidden;
    }
    .image-mat img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .image-mat.with-photo .picture-placeholder { display: none; }
    .picture-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(155deg, #c2c9bf, #e5d8c5 55%, #b6bba9);
      overflow: hidden;
    }
    .picture-placeholder::before {
      content: "";
      width: 65%;
      aspect-ratio: 1;
      position: absolute;
      top: -18%;
      right: -20%;
      border-radius: 50%;
      background: #ffffff40;
      filter: blur(1px);
    }
    .picture-placeholder::after {
      content: "";
      position: absolute;
      bottom: -15%;
      left: -24%;
      width: 150%;
      height: 48%;
      transform: rotate(-11deg);
      background: #7f8b7955;
    }
    .picture-placeholder span {
      position: relative;
      z-index: 1;
      color: #42483e;
      border: 1px solid #42483e66;
      padding: 10px 15px;
      background: #e2e5dd83;
      font-size: 10px;
      letter-spacing: .18em;
      font-weight: 700;
    }
    .spread.tone-1 .picture-placeholder { background: linear-gradient(145deg, #b7bcae, #e4d8c4 60%, #c0b5a6); }
    .spread.tone-2 .picture-placeholder { background: linear-gradient(150deg, #bac7c7, #e2dfd1 58%, #b5bdb3); }
    .spread.tone-3 .picture-placeholder { background: linear-gradient(155deg, #bdc0b5, #d3c0aa 52%, #a4b4a4); }
    .spread.tone-4 .picture-placeholder { background: linear-gradient(140deg, #d0c9bd, #e4dfd2 55%, #adb5ad); }
    .image-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 13px;
      color: #4f554d;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: .02em;
    }
    .photo-index { white-space: nowrap; letter-spacing: .13em; font-weight: 700; }
    .text-leaf {
      display: flex;
      flex-direction: column;
      padding: clamp(36px, 5vw, 76px) clamp(28px, 5.2vw, 86px) 30px;
      background: var(--paper);
    }
    .eyebrow { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .18em; }
    .copy { margin: auto 0; padding: 16px 0 26px; }
    .copy h1, .copy h2 {
      font-family: var(--serif);
      font-weight: 500;
      letter-spacing: -.075em;
      line-height: 1.28;
      margin: 0 0 27px;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .copy h1 { font-size: clamp(36px, 4.65vw, 68px); }
    .copy h2 { font-size: clamp(31px, 3.3vw, 48px); }
    .copy p {
      margin: 0 0 13px;
      color: #686a63;
      font-size: clamp(12px, 1.22vw, 15px);
      line-height: 2.05;
      word-break: keep-all;
      white-space: pre-line;
    }
    .copy p:last-child { margin-bottom: 0; }
    .spread.kind-ending .copy h2 { color: #515b4d; }
    .leaf-footer {
      display: flex;
      flex-shrink: 0;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 15px;
      color: #999990;
      font-size: 10px;
      letter-spacing: .04em;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 32px;
      padding-bottom: 22px;
    }
    .controls-side { display: flex; align-items: center; gap: 18px; min-width: 170px; }
    .controls-side.right { justify-content: flex-end; }
    .nav-btn {
      background: #f7f6f1;
      color: #393b36;
      border: 1px solid #d8d8d0;
      min-width: 111px;
      min-height: 43px;
      padding: 0 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .nav-btn:not(:disabled):hover { background: #fff; transform: translateY(-2px); }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .nav-btn svg { width: 14px; height: 14px; }
    .progress { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .pagination { color: #777970; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dots { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 100px;
      padding: 0;
      border: 0;
      background: #bbbcb5;
      cursor: pointer;
      transition: background .2s, width .2s;
    }
    .dot[aria-current="page"] { background: #5d6957; width: 22px; }
    .below-note { text-align: center; color: #909187; font-size: 11px; padding: 4px 0 28px; }
    @keyframes page-enter { from { opacity: .35; transform: translateX(13px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 820px) {
      .shell { width: min(650px, calc(100% - 30px)); }
      .topbar { padding: 19px 0 17px; }
      .brand { font-size: 17px; }
      .edition { font-size: 9px; letter-spacing: .1em; }
      .topbar-right { gap: 12px; }
      .book { height: auto; min-height: 650px; }
      #spread-root { height: auto; }
      .book::before { display: none; }
      .spread { display: flex; flex-direction: column; min-height: 650px; }
      .spread.image-right .image-leaf, .spread.image-left .image-leaf { order: 1; }
      .spread.image-right .text-leaf, .spread.image-left .text-leaf { order: 2; }
      .image-leaf { height: 310px; flex-shrink: 0; padding: 17px 17px 11px; }
      .image-footer { padding-top: 8px; }
      .text-leaf { min-height: 345px; flex: 1; padding: 32px 34px 24px; }
      .copy { margin: auto 0; padding: 20px 0 28px; }
      .copy h1 { font-size: clamp(42px, 10vw, 64px); }
      .copy h2 { font-size: clamp(34px, 8vw, 48px); }
      .copy p { font-size: 13px; line-height: 1.9; }
      .controls { padding-top: 26px; gap: 8px; }
      .controls-side { min-width: 0; }
      .nav-btn { min-width: 82px; min-height: 41px; padding: 0 12px; }
      .progress { gap: 10px; }
      .dots { gap: 6px; }
      .dot { width: 6px; height: 6px; }
      .dot[aria-current="page"] { width: 16px; }
    }
    @media (max-width: 620px) {
      .topbar { flex-wrap: wrap; row-gap: 13px; }
      .topbar-right { width: 100%; justify-content: space-between; }
      .volume-control input { width: min(30vw, 115px); }
      .edition { display: none; }
    }
    @media (max-width: 390px) {
      .edition { display: none; }
      .image-leaf { height: 255px; }
      .text-leaf { padding: 27px 25px 20px; min-height: 330px; }
      .book, .spread { min-height: 590px; }
      .pagination { font-size: 11px; }
      .nav-btn { min-width: 73px; font-size: 11px; padding: 0 8px; }
      .below-note { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" id="site-name">마음이 흐린 날에</div>
      <div class="topbar-right">
        <div class="edition" id="edition">A LITTLE COMFORT · VOL. 01</div>
        <div class="music-player" role="group" aria-label="직접 만든 배경 음악, 숨 고르기">
          <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false" aria-label="배경 음악 재생">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span id="music-label">음악 켜기</span>
          </button>
          <label class="volume-control" title="배경 음악 음량">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
            <span class="sr-only">음악 음량</span>
            <input type="range" id="music-volume" min="0" max="100" step="5" value="35" aria-label="음악 음량" aria-valuetext="35퍼센트">
          </label>
        </div>
      </div>
    </header>

    <main>
      <div class="book-wrap">
        <div class="book" id="book" aria-label="마음이 흐린 날에, 사진과 글로 구성된 위로의 책자">
          <div id="spread-root" aria-live="polite" aria-atomic="true"></div>
        </div>
      </div>

      <nav class="controls" aria-label="페이지 넘기기">
        <div class="controls-side">
          <button class="nav-btn" id="previous" type="button" aria-label="이전 페이지">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
            이전
          </button>
        </div>
        <div class="progress">
          <div class="dots" id="dots" aria-label="페이지 선택"></div>
          <div class="pagination" id="page-count">01 / 05</div>
        </div>
        <div class="controls-side right">
          <button class="nav-btn" id="next" type="button" aria-label="다음 페이지">
            다음
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
          </button>
        </div>
      </nav>
      <div class="below-note">버튼 또는 키보드 ← → 로 페이지를 넘겨보세요 · 모바일에서는 좌우로 밀어보세요 · 음악을 들으려면 위의 ‘음악 켜기’를 눌러주세요</div>
    </main>
  </div>

  <!-- 이 음악은 이 홈페이지를 위해 새로 작곡하고 직접 합성한 음원입니다.
       자동 재생은 브라우저 정책과 방문자의 선택을 존중하여 사용하지 않습니다. -->
  <audio id="bg-music" src="./music/room-to-breathe.mp3" loop preload="none"></audio>
  <span class="sr-only" id="music-status" role="status" aria-live="polite"></span>

  <script src="./content.js"></script>
  <script>
    (() => {
      "use strict";
      const content = window.BOOKLET_CONTENT || {};
      const pages = Array.isArray(content.pages) ? content.pages : [];
      const root = document.getElementById("spread-root");
      const dotsEl = document.getElementById("dots");
      const countEl = document.getElementById("page-count");
      const prevButton = document.getElementById("previous");
      const nextButton = document.getElementById("next");
      const book = document.getElementById("book");
      const siteName = content.siteName || "작은 책자";
      document.title = siteName;
      document.getElementById("site-name").textContent = siteName;
      document.getElementById("edition").textContent = content.edition || "PHOTO & WORDS";

      const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch]);
      const pageNumber = value => String(value).padStart(2, "0");
      const clamp = value => Math.max(0, Math.min(pages.length - 1, value));
      const hashIndex = () => {
        const match = location.hash.match(/^#page-(\d+)$/);
        return match ? clamp(Number(match[1]) - 1) : 0;
      };
      let index = hashIndex();

      function pageMarkup(page, i) {
        const kind = ["cover", "story", "ending"].includes(page.kind) ? page.kind : "story";
        const layout = page.layout === "image-right" ? "image-right" : "image-left";
        const titleTag = i === 0 ? "h1" : "h2";
        const paragraphs = String(page.body || "").split(/\n\s*\n/).filter(s => s.trim());
        const photoPath = String(page.image || "").trim();
        return `
          <section class="spread ${layout} kind-${kind} tone-${i % 5}" aria-label="${escapeHtml(page.label || `페이지 ${i + 1}`)}">
            <div class="leaf image-leaf">
              <div class="image-mat ${photoPath ? "" : "is-empty"}">
                ${photoPath ? `<img alt="${escapeHtml(page.imageAlt || page.title || "사진")}" src="${escapeHtml(photoPath)}">` : ""}
                <div class="picture-placeholder" aria-hidden="true"><span>PHOTO ${pageNumber(i + 1)} · 사진 넣는 곳</span></div>
              </div>
              <div class="image-footer"><span>${escapeHtml(page.caption || "사진 설명")}</span><span class="photo-index">${pageNumber(i + 1)}</span></div>
            </div>
            <div class="leaf text-leaf">
              <div class="eyebrow">${escapeHtml(page.label || "STORY")}</div>
              <div class="copy">
                <${titleTag}>${escapeHtml(page.title || "제목을 입력하세요")}</${titleTag}>
                ${paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
              </div>
              <div class="leaf-footer"><span>${escapeHtml(content.footer || siteName)}</span><span>${pageNumber(i + 1)} / ${pageNumber(pages.length)}</span></div>
            </div>
          </section>`;
      }

      function render() {
        if (!pages.length) {
          root.innerHTML = '<div style="padding:40px">content.js에 페이지를 추가해주세요.</div>';
          prevButton.disabled = nextButton.disabled = true;
          return;
        }
        const page = pages[index] || pages[0];
        root.innerHTML = pageMarkup(page, index);
        const image = root.querySelector(".image-mat img");
        if (image) {
          const mat = image.parentElement;
          image.addEventListener("load", () => mat.classList.add("with-photo"), {once: true});
          image.addEventListener("error", () => { image.remove(); mat.classList.remove("with-photo"); }, {once: true});
          if (image.complete && image.naturalWidth > 0) mat.classList.add("with-photo");
        }
        prevButton.disabled = index <= 0;
        nextButton.disabled = index >= pages.length - 1;
        countEl.textContent = `${pageNumber(index + 1)} / ${pageNumber(pages.length)}`;
        dotsEl.replaceChildren(...pages.map((p, i) => {
          const dot = document.createElement("button");
          dot.className = "dot";
          dot.type = "button";
          dot.setAttribute("aria-label", `${i + 1}페이지로 이동`);
          if (i === index) dot.setAttribute("aria-current", "page");
          dot.addEventListener("click", () => goTo(i));
          return dot;
        }));
      }

      function goTo(nextIndex) {
        if (!pages.length) return;
        const target = clamp(nextIndex);
        if (target === index) return;
        location.hash = `page-${target + 1}`;
      }
      prevButton.addEventListener("click", () => goTo(index - 1));
      nextButton.addEventListener("click", () => goTo(index + 1));
      window.addEventListener("hashchange", () => { index = hashIndex(); render(); });
      window.addEventListener("keydown", e => {
        if (e.altKey || e.ctrlKey || e.metaKey || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
        if (e.key === "ArrowRight") { e.preventDefault(); goTo(index + 1); }
        if (e.key === "ArrowLeft") { e.preventDefault(); goTo(index - 1); }
      });
      let startX = null;
      let startY = null;
      book.addEventListener("touchstart", e => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive: true});
      book.addEventListener("touchend", e => {
        if (startX === null || !e.changedTouches.length) return;
        const deltaX = e.changedTouches[0].clientX - startX;
        const deltaY = e.changedTouches[0].clientY - startY;
        if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) goTo(index + (deltaX < 0 ? 1 : -1));
        startX = startY = null;
      }, {passive: true});
      // 방문자가 직접 버튼을 눌렀을 때만 재생합니다. 페이지를 넘겨도 유지됩니다.
      const bgm = document.getElementById("bg-music");
      const musicToggle = document.getElementById("music-toggle");
      const musicLabel = document.getElementById("music-label");
      const volumeControl = document.getElementById("music-volume");
      const musicStatus = document.getElementById("music-status");
      bgm.volume = Number(volumeControl.value) / 100;

      function syncMusicButton() {
        const playing = !bgm.paused;
        musicToggle.setAttribute("aria-pressed", String(playing));
        musicToggle.setAttribute("aria-label", playing ? "배경 음악 일시정지" : "배경 음악 재생");
        musicLabel.textContent = playing ? "음악 끄기" : "음악 켜기";
      }
      musicToggle.addEventListener("click", async () => {
        if (!bgm.paused) {
          bgm.pause();
          musicStatus.textContent = "배경 음악이 일시정지되었습니다.";
          return;
        }
        try {
          await bgm.play();
          musicStatus.textContent = "직접 만든 배경 음악 '숨 고르기'를 재생합니다.";
        } catch (error) {
          syncMusicButton();
          musicStatus.textContent = "음악을 재생할 수 없습니다. music 폴더가 함께 있는지 확인해주세요.";
        }
      });
      volumeControl.addEventListener("input", () => {
        const level = Number(volumeControl.value);
        bgm.volume = level / 100;
        volumeControl.setAttribute("aria-valuetext", `${level}퍼센트`);
      });
      bgm.addEventListener("play", syncMusicButton);
      bgm.addEventListener("pause", syncMusicButton);
      bgm.addEventListener("error", () => {
        syncMusicButton();
        musicStatus.textContent = "음악 파일을 찾지 못했습니다. music 폴더를 확인해주세요.";
      });
      render();
    })();
  </script>
</body>
</html>
